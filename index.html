<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track daily expenses and visualize spending distribution across categories">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <header class="app-header">
      <h1>Expense & Budget Visualizer</h1>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark/light theme">🌙</button>
    </header>
    
    <main role="main" class="app-container">
      <!-- Form Section -->
      <section class="form-section" aria-labelledby="form-heading">
        <div class="form-container">
          <h2 id="form-heading">Add Transaction</h2>
          <form id="expenseForm" class="expense-form">
            <div class="form-group">
              <label for="itemName">Item Name <span aria-label="required">*</span></label>
              <input 
                type="text" 
                id="itemName" 
                name="itemName" 
                placeholder="e.g., Coffee, Bus fare"
                required
                aria-label="Item name"
                aria-required="true"
              >
              <span class="error-message" id="itemNameError" role="alert" aria-live="assertive"></span>
            </div>
            
            <div class="form-group">
              <label for="amount">Amount (Rp) <span aria-label="required">*</span></label>
              <input 
                type="number" 
                id="amount" 
                name="amount" 
                placeholder="0.00" 
                step="0.01"
                min="0"
                required
                aria-label="Amount in Rupiah"
                aria-required="true"
              >
              <span class="error-message" id="amountError" role="alert" aria-live="assertive"></span>
            </div>
            
            <div class="form-group">
              <label for="category">Category <span aria-label="required">*</span></label>
              <select 
                id="category" 
                name="category" 
                required
                aria-label="Expense category"
                aria-required="true"
              >
                <option value="">-- Select Category --</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Fun">Fun</option>
              </select>
              <span class="error-message" id="categoryError" role="alert" aria-live="assertive"></span>
            </div>
            
            <button type="submit" class="btn btn-primary">Add Expense</button>
          </form>
        </div>
      </section>
      
      <!-- Balance Section -->
      <section class="balance-section" aria-labelledby="balance-heading">
        <div class="balance-container">
          <h2 id="balance-heading">Total Spent</h2>
          <div class="balance-card">
            <div id="balanceAmount" class="balance-amount" role="status" aria-live="polite">
              Rp 0.00
            </div>
          </div>
        </div>
      </section>
      
      <!-- Chart Section -->
      <section class="chart-section" aria-labelledby="chart-heading">
        <div class="chart-container">
          <h2 id="chart-heading">Spending Distribution</h2>
          <div class="chart-wrapper">
            <canvas id="categoryChart" role="img" aria-label="Pie chart showing spending distribution by category"></canvas>
            <div id="chartPlaceholder" class="chart-placeholder" role="status">
              Add transactions to see spending distribution
            </div>
          </div>
        </div>
      </section>
      
      <!-- List Section -->
      <section class="list-section" aria-labelledby="list-heading">
        <div class="list-container">
          <h2 id="list-heading">Transaction History</h2>
          <div id="transactionList" class="transaction-list" role="list"></div>
          <div id="emptyState" class="empty-state" role="status">
            No transactions yet. Start by adding one above.
          </div>
        </div>
      </section>
    </main>
    
    <!-- Storage Warning -->
    <div id="storageWarning" class="warning-banner hidden" role="alert" aria-live="assertive">
      ⚠️ Your data will not persist after closing the browser.
    </div>
  </div>
  
  <!-- Chart.js Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  
  <!-- Application JavaScript -->
  <script src="js/app.js"></script>
</body>
</html>
